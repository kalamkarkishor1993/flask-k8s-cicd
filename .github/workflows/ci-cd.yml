name: ci-cd
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: cd app && pytest
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flask-app:${{ github.sha }} .

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flask-app:${{ github.sha }}
          severity: CRITICAL
          exit-code: 1      
